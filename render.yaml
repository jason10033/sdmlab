services:
  - type: web
    name: sdmlab
    env: node
    # NODE_ENV=production (needed at runtime) makes npm skip devDependencies,
    # but the client build needs vite (a devDependency), so include dev deps here.
    buildCommand: >
      npm install --include=dev &&
      cd server && npm install && cd .. &&
      cd client && npm install --include=dev && npm run build
    startCommand: cd server && npm start
    disk:
      name: sdmlab-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
